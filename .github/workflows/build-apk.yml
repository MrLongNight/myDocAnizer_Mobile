name: Build APK

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Locate Project & Ensure Gradle Wrapper
        run: |
          echo "=== Workspace contents ==="
          ls -la

          if [ -f "settings.gradle.kts" ]; then
            TARGET_DIR="."
          elif [ -f "applet/settings.gradle.kts" ]; then
            TARGET_DIR="applet"
          else
            FOUND=$(find . -maxdepth 3 -name "settings.gradle.kts" -not -path "*/.*" | head -n 1)
            if [ -n "$FOUND" ]; then
              TARGET_DIR=$(dirname "$FOUND")
            else
              TARGET_DIR="."
            fi
          fi

          echo "Projekt-Verzeichnis ist: $TARGET_DIR"
          echo "PROJECT_DIR=$TARGET_DIR" >> "$GITHUB_ENV"

          cd "$TARGET_DIR"

          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Erzeuge Gradle Wrapper..."
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          fi

          chmod +x gradlew

      - name: Prepare Environment & Keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          cd "${{ env.PROJECT_DIR }}"

          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Missing GitHub Actions secret DEBUG_KEYSTORE_BASE64."
            echo "Add the base64 content of your private debug keystore in Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          if [ ! -s debug.keystore ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 did not produce a valid keystore file."
            exit 1
          fi

      - name: Build Debug APK
        run: |
          cd "${{ env.PROJECT_DIR }}"
          ./gradlew assembleDebug testDebugUnitTest --stacktrace --no-daemon

      # AndroidKeyStore-backed SecretStore and PDF behavior require a real Android runtime.
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            cd "${{ env.PROJECT_DIR }}"
            ./gradlew connectedDebugAndroidTest --stacktrace --no-daemon

      - name: Find and Verify APK
        id: apk-check
        run: |
          APK_PATH="${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Installierbare Debug-App nicht gefunden: $APK_PATH"
            echo "Vorhandene APKs zur Diagnose:"
            find "${{ env.PROJECT_DIR }}" -type f -name "*.apk" -not -path "*/.*" -print
            exit 1
          fi

          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          if [ -z "$AAPT" ]; then
            echo "::error::Android aapt tool not found; cannot verify APK metadata"
            exit 1
          fi
          BADGING=$("$AAPT" dump badging "$APK_PATH")
          echo "$BADGING" | grep -F "package: name='com.aistudio.mydocanizer.app.v28' versionCode='281' versionName='2.8.1'" || {
            echo "::error::APK package/version metadata does not match the expected installable app"
            echo "$BADGING" | head -n 5
            exit 1
          }

          echo "Installierbare Haupt-App: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_PATH"
          sha256sum "$APK_PATH"
          "$AAPT" dump badging "$APK_PATH" | head -n 3

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: myDocAnizer-Mobile-APK
          path: ${{ steps.apk-check.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
